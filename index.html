<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xXFEOXx | Portafolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Paleta de colores Celeste y Azul */
            --bg-color: #050a14;
            --card-bg: #0d1626;
            --accent: #00d4ff; /* Celeste brillante */
            --accent-dark: #0056b3; /* Azul profundo */
            --text-main: #e6f1ff;
            --border: #1e2d40;
            --gradient: linear-gradient(135deg, #00d4ff 0%, #0056b3 100%);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            /* Fondo con un toque de azul muy sutil */
            background-image: radial-gradient(circle at top right, #002b5c, transparent);
            background-attachment: fixed;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px -10px var(--accent);
        }

        .username {
            font-family: 'Fira Code', monospace;
            color: var(--accent);
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
        }

        .profile-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .profile-section { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -10px rgba(0, 212, 255, 0.3);
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-pill {
            background: var(--gradient);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .skills-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-tag {
            background: #162a45;
            border: 1px solid var(--accent-dark);
            padding: 5px 12px;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--accent);
        }

        .project-item {
            margin-bottom: 15px;
            padding-left: 15px;
            border-left: 3px solid var(--accent-dark);
        }

        .contact-links a {
            color: var(--accent);
            text-decoration: none;
            display: block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .contact-links a:hover {
            text-decoration: underline;
            color: #fff;
        }

        .quote {
            font-style: italic;
            opacity: 0.7;
            margin-top: 40px;
            text-align: center;
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .high-perf-icon {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
